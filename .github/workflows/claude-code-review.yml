name: Claude Code Review

# The FIRST half of the review gate Tom greenlit on `tclancy/bluelinky#35` --
# option (a). This workflow PRODUCES a review; `require-review.yml` publishes a
# commit status saying whether one exists for the current head. Neither half is
# useful alone: a reviewer with no status leaves an unreviewed PR looking
# exactly like a reviewed one, and a status with no reviewer is a red X with no
# remedy.
#
# Ported from `tclancy/parsons-remote`'s copy on `main` at blob
# `1cc233622faf016917cd48ecdfda78b0c7918d76`. Every `if:`, trigger, pin and
# `claude_args` value below is that file's. The divergences are listed under
# WHAT DIFFERS.
#
# IT CANNOT RUN HERE YET, and this PR does not pretend otherwise. The Claude
# GitHub App is not installed on this repo -- `claude[bot]` has posted zero
# times, measured 2026-11-01 -- and `secrets.CLAUDE_CODE_OAUTH_TOKEN` does not
# exist, which the sibling gate reports as `pending` rather than as a red X.
# Both are repo-settings writes that 403 under the bot App's token, so they are
# Tom's: install the App, add the secret. Until then this workflow is installed
# and inert, which is the state bluelinky and abi-django-utils are also in.
#
# Steady-state burn reduction (metaframework#320 §5), inherited:
#   - Auto-trigger on `opened`/`reopened` only, never `synchronize`. A 10-commit
#     PR used to fire 10 model reviews; now it fires one.
#   - Skip Dependabot and `chore` PRs entirely.
#   - Re-review on demand with a comment containing `/review` or
#     `@claude review`.
#
# WHAT DIFFERS from parsons-remote's copy. Two things, both in the
# `Resolve PR head SHA` step, and both are fixes rather than adaptations:
#
#   1. Event values arrive through `env:` instead of being interpolated into
#      the script with `${{ }}`. parsons-remote's copy interpolates, and its
#      own test suite carries a test
#      (`test_the_reviewer_workflow_is_a_known_exemption`) whose docstring says
#      the pattern "cannot be fixed from a reviewable PR" -- because editing
#      that file there triggers the action's anti-tamper **workflow validation
#      skip**, so the run goes green having reviewed nothing. That reasoning is
#      about a file that already exists on a default branch. This file does
#      not: it is NEW here, so there is no byte-identical copy to diverge from
#      and nothing to dodge. The exemption would have been inherited purely by
#      copying, so it is not inherited.
#      Consequence: `tests/test_require_review_workflow.py` bans the expression
#      token from `run:` blocks in BOTH workflows here, with no exemption.
#   2. `set -euo pipefail`. Without it, a failing `gh api` on the
#      `issue_comment` path leaves `sha` empty, `actions/checkout` silently
#      falls back to the triggering ref, and the reviewer reads the WRONG CODE
#      while reporting success. Strict mode turns that into a red step.
#
# The values are all GitHub-controlled (an event name, a number, a repo slug, a
# SHA), so neither change closes a live injection -- stated plainly because the
# tempting justification overclaims. They remove the pattern and a real
# wrong-code path.

on:
  pull_request:
    # `reopened` is load-bearing and agrees with `tests.yml`'s own note on the
    # same trigger. `opened` alone cannot re-gate a fix-up push, and neither
    # can the documented fallback: a check-run attaches to the SHA of the
    # *event*, so an `issue_comment` (`/review`) run attaches to `main`'s tip
    # and never marks the PR head reviewed, while the `opened` verdict is
    # simply absent from a new head -- which renders as green rather than as
    # unreviewed. `synchronize` stays OFF: it fires once per push, which is the
    # exact burn metaframework#320 §5 cut. `reopened` costs one review per
    # deliberate `gh pr close && gh pr reopen`, and is the only on-demand
    # trigger an agent can fire that carries the PR head (`gh run rerun` is
    # refused to the App token, and would replay a stale merge commit anyway).
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # MUST stay false. Concurrency cancellation happens when a run is *created*,
  # before job-level `if` filtering -- so with cancel-in-progress: true, ANY
  # comment on the PR (including the review's own `gh pr comment`) spawned an
  # issue_comment run in this group and cancelled the in-flight review job.
  # Every pull_request-triggered review self-cancelled seconds after posting.
  # The superseded-review case this once guarded (re-review on push) died when
  # metaframework#320 dropped the `synchronize` trigger; queueing is always
  # correct now.
  cancel-in-progress: false

jobs:
  claude-review:
    # Run when:
    #   - PR opened/reopened by a non-Dependabot author with a non-`chore`
    #     title, OR
    #   - a comment on a PR explicitly asks for `/review` or `@claude review`.
    #
    # The author list and the title-prefix list are both pinned by
    # `tests/test_require_review_workflow.py` against `.github/review-gate.jq`:
    # the gate exempts the same AUTHORS and deliberately exempts no title
    # prefix, so adding a `docs` prefix here goes red over there rather than
    # silently creating a PR class the gate demands a review for and this
    # workflow declines to perform.
    if: |
      (github.event_name == 'pull_request'
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && !startsWith(github.event.pull_request.title, 'chore'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && (contains(github.event.comment.body, '/review')
            || contains(github.event.comment.body, '@claude review')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Values through `env:`, never interpolated here -- see WHAT DIFFERS
          # at the top of this file. An expression in a `run:` body is parsed
          # by GitHub before the shell sees it, even inside a `#` comment, and
          # an invalid one makes the whole file unparseable (bluelinky #52: a
          # run that FAILED with zero jobs, no annotation and no log, while
          # check-yaml, prettier and action-validator all passed it).
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            sha="$(gh api "repos/${REPO}/pulls/${ISSUE_NUMBER}" --jq .head.sha)"
          else
            sha="$PR_HEAD_SHA"
          fi
          # Belt-and-braces under `set -u`: an empty `ref:` makes
          # `actions/checkout` fall back to the triggering ref, so the reviewer
          # would read the wrong code and still report success.
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve a head SHA; refusing to review an unknown ref."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.sha }}

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'metaframework-dispatch-bot'
          # REQUIRED to post inline comments, and the non-obvious one.
          # `--allowed-tools` only FILTERS already-registered MCP servers; it
          # does not register them. Without track_progress the
          # github_inline_comment server never connects, so the inline-comment
          # tool is denied even when correctly allow-listed -- the model burns
          # turns retrying and the job exits `success` having posted nothing.
          # Diagnosed on sandy (#160/#164), where the tell was
          # `No buffered inline comments` in the log.
          #
          # It is also what makes `require-review.yml` listen for
          # `issue_comment: edited`: track_progress posts an in-flight comment
          # and edits it into the finished one in place, and the gate scores
          # comments on `updated_at` for that reason.
          track_progress: true
          # Defaults to TRUE and has documented buffering bugs; upstream's own
          # example omits it, which reads as "default is fine" but leaves the
          # buggy path on. Pinned off so an upstream default change cannot
          # reintroduce it.
          classify_inline_comments: false
          prompt: |
            Review this pull request for:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            This repository has no CLAUDE.md. Its conventions are in README.md
            and docs/superpowers/specs/; the house style is small pure
            functions and invariants expressed as tests. Be constructive and
            specific.

            Post findings that point at specific lines with
            mcp__github_inline_comment__create_inline_comment. Use `gh pr comment`
            for the overall summary, or for findings with no single line to anchor
            to. Say so in the summary if you find nothing worth flagging, so a
            silent pass is distinguishable from a broken run.
          # mcp__github_inline_comment__create_inline_comment must be listed
          # here AND registered by track_progress above -- both, or inline
          # comments silently no-op. --max-turns bounds the blast radius: a
          # denied tool otherwise retries to the turn limit, burning minutes to
          # produce nothing, and this account has exhausted its allowance two
          # months running.
          #
          # --max-turns 40 is a MEASUREMENT and it is ITGUY'S, not this repo's,
          # which has never run this workflow at all. Taken from itguy's
          # streamed result JSON under the old cap of 25 (itguy #211, fixed in
          # itguy PR #220):
          #
          #   run 34088207877  #212  26 turns / 10 denials  $0.49  error_max_turns
          #   run 34088470544  #212  27 turns / 10 denials         success
          #   run 34127739755  #216  32 turns /  7 denials  $0.59  success
          #   run 34171629175  #219  26 turns /  9 denials  $0.55  error_max_turns
          #   run 34171815438  #219  26 turns /  6 denials         success
          #
          # Every one is a RED check, and that is the point: three of the five
          # completed a real review and were failed anyway, by the action's
          # post-check ("reported a successful result after 32 turns, exceeding
          # the configured maximum of 25"). The cap was not protecting against
          # runaway reviews, it was discarding finished ones. 32 is the measured
          # requirement; 40 is that plus headroom, and matches the six fleet
          # repos already there (canvasoptimizer, homelab, itguy, metaframework,
          # parsons-remote, sandy). So it is inherited on their evidence, not
          # confirmed on this repo's -- the first real review here is the first
          # data point.
          #
          # TodoWrite is allow-listed for fleet consistency and because it is
          # harmless -- an in-session scratchpad with no filesystem or GitHub
          # write surface. It is deliberately NOT claimed as the cause of the
          # 6-10 denials per run: the streamed log records the denial COUNT and
          # never which tool was denied, `grep -c TodoWrite` over two full itguy
          # run logs is 0, and three of the five runs above ticked their
          # checklists completely with TodoWrite absent from this list. What is
          # being denied 6-10 times a run is still unidentified.
          #
          # Both settings are pinned by
          # `tests/test_require_review_workflow.py`, which is the only thing
          # here that can fire before the App is installed.
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,TodoWrite,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)" --max-turns 40'
