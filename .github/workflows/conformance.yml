name: Conformance

# Nightly differential of the queue model against a real qBittorrent container
# (P2). Failures push an ntfy alert; see tools/conformance_alert.sh.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "R8 drill: compare the first unregistered scenario against a deliberately wrong prediction"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    # timeout-minutes arithmetic (brief's formula, scenarios x events x
    # (settle + 2 polls) x 2 retry + 3 min container start):
    #   18 scenarios, 34 events in total (sum over scenarios, max 3 each)
    #   settle_s = 15, poll ~1-2 s so 2 polls = 4 s -> 19 s per event
    #   34 x 19 s x 2 = 1292 s = 21.5 min; + 3 min start = 24.5 -> 25 min.
    # Measured, for scale: the full local container run (33 items: 18
    # differential + 15 harness/assumption tests) took 738 s = 12.3 min.
    # 25 is under the 45 min ceiling, so no matrix split is needed.
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run conformance differential
        run: uv run --frozen pytest -m container -q
        env:
          CONFORMANCE_FORCE_FAILURE: ${{ inputs.force_failure }}

      # Only runs when an earlier step failed, so a green run never exercises it.
      - name: Alert on failure
        if: failure()
        run: tools/conformance_alert.sh
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
